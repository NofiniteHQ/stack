name: CI - nuicss

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'packages/nuicss/**'
  pull_request:
    paths:
      - 'packages/nuicss/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test nuicss
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm nx run nuicss:test

      - name: Build
        run: pnpm nx run nuicss:build

  publish:
    name: Publish nuicss
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm nx run nuicss:build

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v2
        with:
          publish-script: pnpm changeset publish
          version-script: pnpm changeset version
          commit-message: "chore(release): version nuicss"
          pr-title: "chore(release): version nuicss"
        env:
          GITHUB_TOKEN: ${ secrets.GITHUB_TOKEN }
          NPM_TOKEN: ${ secrets.NPM_TOKEN }

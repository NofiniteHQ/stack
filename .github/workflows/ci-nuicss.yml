name: CI - nuicss

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'packages/nuicss/**'
  pull_request:
    paths:
      - 'packages/nuicss/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test nuicss
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm nx run nuicss:test

      - name: Build
        run: pnpm nx run nuicss:build

name: CI - locale

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'packages/locale/**'
  pull_request:
    paths:
      - 'packages/locale/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test locale
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm nx run locale:test

      - name: Build
        run: pnpm nx run locale:build

  publish:
    name: Publish locale
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm nx run locale:build

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: "chore(release): version locale"
          title: "chore(release): version locale"
        env:
          GITHUB_TOKEN: ${ secrets.GITHUB_TOKEN }
          NPM_TOKEN: ${ secrets.NPM_TOKEN }

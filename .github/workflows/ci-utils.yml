name: CI - utils

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'packages/utils/**'
  pull_request:
    paths:
      - 'packages/utils/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test utils
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm nx run utils:test

      - name: Build
        run: pnpm nx run utils:build

  publish:
    name: Publish utils
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm nx run utils:build

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: "chore(release): version utils"
          title: "chore(release): version utils"
        env:
          GITHUB_TOKEN: ${ secrets.GITHUB_TOKEN }
          NPM_TOKEN: ${ secrets.NPM_TOKEN }

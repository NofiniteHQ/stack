name: CI - nui

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'packages/nui/**'
  pull_request:
    paths:
      - 'packages/nui/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test nui
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm nx run nui:test

      - name: Build
        run: pnpm nx run nui:build

      - name: Verify package contents
        working-directory: packages/nui
        run: |
          TARBALL_FILES=$(npm pack --dry-run 2>&1)
          if ! echo "$TARBALL_FILES" | grep -q "dist/components"; then
            echo "Error: dist/components is missing from the tarball!"
            echo "Tarball contents:"
            echo "$TARBALL_FILES"
            exit 1
          fi
          echo "Verification passed. dist/components is present."

name: CI - nuicss-cli

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'packages/nuicss-cli/**'
  pull_request:
    paths:
      - 'packages/nuicss-cli/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test nuicss-cli
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build nuicss
        run: pnpm nx run nuicss:build
        
      - name: Build CLI
        run: pnpm nx run nuicss-cli:build

      - name: Verify package contents
        working-directory: packages/nuicss-cli
        run: |
          TARBALL_FILES=$(npm pack --dry-run 2>&1)
          if ! echo "$TARBALL_FILES" | grep -q "dist/index.js"; then
            echo "Error: dist/index.js is missing from the tarball!"
            echo "Tarball contents:"
            echo "$TARBALL_FILES"
            exit 1
          fi
          echo "Verification passed. dist/index.js is present."

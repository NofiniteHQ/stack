name: CI - cli

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'packages/cli/**'
  pull_request:
    paths:
      - 'packages/cli/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build CLI
        working-directory: ./packages/cli
        run: pnpm run build

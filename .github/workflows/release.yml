name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build All Packages
        run: pnpm nx run-many --target=build --all

      - name: Verify Package Tarballs
        shell: bash
        run: |
          TMP_PACK_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_PACK_DIR"' EXIT
          for pkg in nuicss nuicss-cli nui markon charts kanban media locale utils; do
            echo "Verifying package tarball: $pkg"
            TARBALL=$(cd "packages/$pkg" && pnpm pack --pack-destination "$TMP_PACK_DIR" | tail -n 1)
            echo "  -> Packed $(basename "$TARBALL") ($(wc -c < "$TARBALL") bytes)"
            tar -tzf "$TARBALL" | grep -E '\.(test|spec)\.' && { echo "ERROR: test file found in $pkg tarball"; exit 1; } || true
            UNPACK_DIR="$TMP_PACK_DIR/unpack-$pkg"
            mkdir -p "$UNPACK_DIR"
            tar -xzf "$TARBALL" -C "$UNPACK_DIR"
            grep -n '"workspace:' "$UNPACK_DIR/package/package.json" && { echo "ERROR: workspace:* found in $pkg package.json"; exit 1; } || true
            if [ "$pkg" = "markon" ]; then
              SIZE_BYTES=$(wc -c < "$TARBALL")
              if [ "$SIZE_BYTES" -ge 512000 ]; then
                echo "ERROR: @nofinite/markon tarball exceeds 500 KB budget ($SIZE_BYTES bytes)"
                exit 1
              fi
              grep -rnE 'jsdom|happy-dom|parse5' "$UNPACK_DIR/package/dist" && { echo "ERROR: DOM emulator leaked into markon dist"; exit 1; } || true
            fi
          done

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm changeset publish
          version-script: pnpm changeset version
          commit-message: 'chore(release): publish packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: 'chore(release): publish packages'
          create-github-releases: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Determine CLI Release Tag
        if: steps.changesets.outputs.published == 'true'
        id: cli-tag
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
          PUBLISHED_PACKAGES_LEGACY: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          node -e "
            const fs = require('node:fs');
            const raw = process.env.PUBLISHED_PACKAGES || process.env.PUBLISHED_PACKAGES_LEGACY || '[]';
            try {
              const pkgs = JSON.parse(raw);
              const cli = Array.isArray(pkgs) ? pkgs.find((p) => p && p.name === 'nuicss') : null;
              if (cli && cli.version) {
                fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag=nuicss@' + cli.version + '\n');
                fs.appendFileSync(process.env.GITHUB_OUTPUT, 'upload=true\n');
              } else {
                fs.appendFileSync(process.env.GITHUB_OUTPUT, 'upload=false\n');
              }
            } catch (err) {
              console.error('Failed to parse published packages:', err);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'upload=false\n');
            }
          "

      - name: Setup Bun
        if: steps.changesets.outputs.published == 'true' && steps.cli-tag.outputs.upload == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Build Standalone Binaries (nuicss)
        if: steps.changesets.outputs.published == 'true' && steps.cli-tag.outputs.upload == 'true'
        working-directory: packages/nuicss-cli
        run: pnpm run build:binaries

      - name: Upload Standalone Binaries to GitHub Release
        if: steps.changesets.outputs.published == 'true' && steps.cli-tag.outputs.upload == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.cli-tag.outputs.tag }}
          files: packages/nuicss-cli/bin/nuicss-*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build All Packages
        run: pnpm nx run-many --target=build --all

      - name: Verify package contents (nui)
        working-directory: packages/nui
        run: |
          TARBALL_FILES=$(npm pack --dry-run 2>&1)
          if ! echo "$TARBALL_FILES" | grep -q "dist/components"; then
            echo "Error: dist/components is missing from the tarball!"
            echo "Tarball contents:"
            echo "$TARBALL_FILES"
            exit 1
          fi
          echo "Verification passed. dist/components is present."

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v2
        with:
          publish-script: pnpm changeset publish
          version-script: pnpm changeset version
          commit-message: "chore(release): publish packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: "chore(release): publish packages"
          create-github-releases: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
